name: record-results

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 3:00 JST(その日のレースが全て終わった後)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: predict-cycle   # 【2026-09-14追加】predict_cycle.ymlと同じグループにすることで、
                          # 2つのワークフローが同時にnote.comの同じセッションを使わないようにする
                          # (同時利用がセッション切断の原因になっていた可能性があるため)
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record yesterday's results
        run: python pipeline.py record

      - name: Commit updated results
        run: |
          git config user.name "kyotei-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prediction_record.csv || true
          git diff --cached --quiet || git commit -m "auto: record results $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              echo "push succeeded (attempt $i)"
              exit 0
            fi
            echo "push failed (attempt $i), retrying..."
            git rebase --abort || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "::warning::5回リトライしてもpushできませんでした。このサイクル分の結果は未保存です。"
          exit 1

      - name: Restore note.com cookies
        env:
          NOTE_COOKIES_JSON: ${{ secrets.NOTE_COOKIES_JSON }}
        run: printf '%s' "$NOTE_COOKIES_JSON" > note_cookies.json

      - name: Post daily results article to note
        env:
          NOTE_BROWSER: edge
        run: python post_daily_results.py

      - name: Upload note debug HTML on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-${{ github.run_id }}
          path: |
            note_draft_fail_debug.html
            note_publish_fail_debug.html
            note_paywall_settings_debug.html
          retention-days: 3
          if-no-files-found: ignore
