name: predict-cycle

on:
  schedule:
    # cronはUTC。JST 8:00〜21:00をカバーするため2本に分けている
    # (23:00-23:59 UTC = 8:00-8:59 JST) と (0:00-11:59 UTC = 9:00-20:59 JST)
    # 【2026-09-16変更】5分間隔だと、1回の処理(3〜30分)が終わる前に次のトリガーが
    # 発生し、GitHub Actionsのconcurrency仕様(実行中1つ+待機中1つまでで、待機中は
    # 新しいトリガーが来るたびに問答無用で置き換えられる)により、ほとんどの
    # スケジュールトリガーが一度も実行されずに捨てられていたことが判明した。
    # 10分間隔に戻す(auto_predict_cycle.py側の窓の仕組みは元々これくらいの間隔の
    # 揺れを吸収できる設計になっている)。
    - cron: "*/10 23 * * *"
    - cron: "*/10 0-11 * * *"
  workflow_dispatch: {}   # 手動実行用(スマホアプリの「Run workflow」からも実行可能)

permissions:
  contents: write   # 予想結果ファイルをリポジトリにコミットし直すため

concurrency:
  group: predict-cycle
  cancel-in-progress: false   # 前回の実行が終わっていなければ待つ(同時実行によるファイル競合を防ぐ)
  queue: max   # 【2026-09-16追加】待機中の実行を1つに制限せず、キューに並べる(取りこぼし防止の保険)

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore note.com cookies
        env:
          NOTE_COOKIES_JSON: ${{ secrets.NOTE_COOKIES_JSON }}
        run: printf '%s' "$NOTE_COOKIES_JSON" > note_cookies.json

      - name: Run prediction cycle
        env:
          NOTE_BROWSER: edge
        run: python auto_predict_cycle.py

      - name: Upload log as artifact (only on failure, for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auto_cycle_log-${{ github.run_id }}
          path: auto_cycle_log.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload note debug HTML if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-debug-${{ github.run_id }}
          path: |
            note_draft_fail_debug.html
            note_publish_fail_debug.html
            note_paywall_settings_debug.html
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit updated results
        run: |
          git config user.name "kyotei-auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prediction_record.csv race_progress.json || true
          git diff --cached --quiet || git commit -m "auto: predict cycle $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              echo "push succeeded (attempt $i)"
              exit 0
            fi
            echo "push failed (attempt $i), retrying..."
            git rebase --abort || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "::warning::5回リトライしてもpushできませんでした。このサイクル分の結果は未保存です。"
          exit 1
